<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — Agent Gate</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #111111;
      --border: #555555;
      --text: #e0e0e0;
      --muted: #888888;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    form { background: var(--surface); padding: 2.5rem; border-radius: 8px; border: 1px solid var(--border); min-width: 320px; }
    h2 { margin-bottom: 0.5rem; font-weight: 600; }
    .price { color: var(--muted); margin-bottom: 1.5rem; }
    input, button { display: block; margin: 0.6rem 0; padding: 0.7rem; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; }
    button { background: var(--accent); color: #000; border: none; font-weight: 500; cursor: pointer; }
    #msg { margin-top: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <form id="pay">
    <h2>Team plan</h2>
    <div class="price">$49 / month</div>
    <input id="card" placeholder="Card number" required>
    <input id="exp" placeholder="MM/YY" required>
    <input id="cvc" placeholder="CVC" required>
    <button type="submit">Pay $49</button>
    <div id="msg"></div>
  </form>
  <script>
    document.getElementById('pay').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.textContent = 'Payment processing is not connected yet. This is a placeholder.';
      // In production this would call Stripe or similar
      setTimeout(() => { location.href = '/app'; }, 1500);
    };
  </script>
</body>
</html>
