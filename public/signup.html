<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Agent Gate</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #111111;
      --border: #555555;
      --text: #e0e0e0;
      --muted: #888888;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    form { background: var(--surface); padding: 2.5rem; border-radius: 8px; border: 1px solid var(--border); min-width: 320px; }
    h2 { margin-bottom: 1.5rem; font-weight: 600; }
    input, button { display: block; margin: 0.6rem 0; padding: 0.7rem; width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; }
    button { background: var(--accent); color: #000; border: none; font-weight: 500; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .error { color: #ff5555; margin-top: 0.5rem; font-size: 0.9rem; }
    a { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <form id="signup">
    <h2>Create account</h2>
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Continue</button>
    <div id="error" class="error"></div>
    <p style="margin-top: 1rem;"><a href="/login">Already have an account?</a></p>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    const plan = params.get('plan') || 'starter';
    document.getElementById('signup').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value, plan })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('error').textContent = data.error || 'Signup failed';
        return;
      }
      if (plan === 'team') {
        location.href = '/payment?plan=team';
      } else {
        location.href = '/app';
      }
    };
  </script>
</body>
</html>
