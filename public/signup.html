<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Agent Gate</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #111111;
      --border: #555555;
      --text: #e0e0e0;
      --muted: #888888;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
    form { background: var(--surface); padding: 2.5rem; border-radius: 8px; border: 1px solid var(--border); width: 100%; max-width: 440px; position: relative; }
    h2 { margin-bottom: 0.5rem; font-weight: 600; }
    .plan { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.9rem 0 0.3rem; }
    input, select {
      display: block;
      width: 100%;
      padding: 0.7rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1rem;
    }
    input:focus, select:focus { outline: none; border-color: #aaa; }
    input.invalid { border-color: #ff5555; }
    input.valid { border-color: #55cc55; }
    button {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ff5555; margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2em; }
    a { color: var(--muted); font-size: 0.9rem; }
    .row { display: flex; gap: 0.75rem; }
    .row > div { flex: 1; }
    .phone-row { display: flex; gap: 0.5rem; }
    .phone-row select { width: 130px; flex-shrink: 0; }
    .phone-row input { flex: 1; }
    .optional { color: #666; }
    #suggestions {
      position: absolute;
      left: 2.5rem;
      right: 2.5rem;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    #suggestions div {
      padding: 0.6rem 0.75rem;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #222;
    }
    #suggestions div:hover { background: #222; }
    #suggestions div:last-child { border-bottom: none; }
    .spinner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <form id="signup" novalidate>
    <h2>Create account</h2>
    <div class="plan" id="plan-label"></div>

    <label>Username</label>
    <input name="username" required autocomplete="username" minlength="3">

    <label>Email</label>
    <input name="email" type="email" required autocomplete="email">

    <label>Password</label>
    <input name="password" type="password" required autocomplete="new-password" minlength="8">

    <label>Business name <span class="optional">(optional)</span></label>
    <input name="business" autocomplete="organization">

    <label>Address</label>
    <input id="address-search" name="address-search" placeholder="Start typing an address" autocomplete="off">
    <div id="suggestions"></div>

    <label>Street</label>
    <input name="street" autocomplete="street-address">

    <div class="row">
      <div>
        <label>City</label>
        <input name="city" autocomplete="address-level2">
      </div>
      <div>
        <label>Postal code</label>
        <input name="postal" autocomplete="postal-code">
      </div>
    </div>

    <label>Country</label>
    <input name="country" autocomplete="country-name">

    <label>Phone <span class="optional">(optional)</span></label>
    <div class="phone-row">
      <select id="phone-code" name="phoneCode"></select>
      <input name="phone" type="tel" inputmode="numeric" placeholder="Phone number" autocomplete="tel">
    </div>

    <button type="submit" id="submit">Continue</button>
    <div id="error" class="error"></div>
    <p style="margin-top: 1.25rem;"><a href="/login">Already have an account?</a></p>
  </form>

  <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>

  <script>
    const countries = [
      { c: '+1', f: '🇺🇸', n: 'US' },
      { c: '+1', f: '🇨🇦', n: 'CA' },
      { c: '+44', f: '🇬🇧', n: 'UK' },
      { c: '+47', f: '🇳🇴', n: 'NO' },
      { c: '+46', f: '🇸🇪', n: 'SE' },
      { c: '+45', f: '🇩🇰', n: 'DK' },
      { c: '+49', f: '🇩🇪', n: 'DE' },
      { c: '+33', f: '🇫🇷', n: 'FR' },
      { c: '+31', f: '🇳🇱', n: 'NL' },
      { c: '+34', f: '🇪🇸', n: 'ES' },
      { c: '+39', f: '🇮🇹', n: 'IT' },
      { c: '+41', f: '🇨🇭', n: 'CH' },
      { c: '+43', f: '🇦🇹', n: 'AT' },
      { c: '+32', f: '🇧🇪', n: 'BE' },
      { c: '+48', f: '🇵🇱', n: 'PL' },
      { c: '+351', f: '🇵🇹', n: 'PT' },
      { c: '+353', f: '🇮🇪', n: 'IE' },
      { c: '+358', f: '🇫🇮', n: 'FI' },
      { c: '+61', f: '🇦🇺', n: 'AU' },
      { c: '+64', f: '🇳🇿', n: 'NZ' },
      { c: '+81', f: '🇯🇵', n: 'JP' },
      { c: '+82', f: '🇰🇷', n: 'KR' },
      { c: '+86', f: '🇨🇳', n: 'CN' },
      { c: '+91', f: '🇮🇳', n: 'IN' },
      { c: '+55', f: '🇧🇷', n: 'BR' },
      { c: '+52', f: '🇲🇽', n: 'MX' },
      { c: '+54', f: '🇦🇷', n: 'AR' },
      { c: '+27', f: '🇿🇦', n: 'ZA' },
      { c: '+971', f: '🇦🇪', n: 'AE' },
      { c: '+972', f: '🇮🇱', n: 'IL' },
      { c: '+90', f: '🇹🇷', n: 'TR' },
      { c: '+7', f: '🇷🇺', n: 'RU' },
      { c: '+380', f: '🇺🇦', n: 'UA' },
      { c: '+48', f: '🇵🇱', n: 'PL' },
      { c: '+420', f: '🇨🇿', n: 'CZ' },
      { c: '+36', f: '🇭🇺', n: 'HU' },
      { c: '+30', f: '🇬🇷', n: 'GR' },
      { c: '+40', f: '🇷🇴', n: 'RO' },
      { c: '+359', f: '🇧🇬', n: 'BG' },
      { c: '+385', f: '🇭🇷', n: 'HR' },
      { c: '+386', f: '🇸🇮', n: 'SI' },
      { c: '+421', f: '🇸🇰', n: 'SK' },
      { c: '+370', f: '🇱🇹', n: 'LT' },
      { c: '+371', f: '🇱🇻', n: 'LV' },
      { c: '+372', f: '🇪🇪', n: 'EE' },
      { c: '+354', f: '🇮🇸', n: 'IS' },
      { c: '+356', f: '🇲🇹', n: 'MT' },
      { c: '+357', f: '🇨🇾', n: 'CY' },
      { c: '+352', f: '🇱🇺', n: 'LU' }
    ];
    const phoneSelect = document.getElementById('phone-code');
    countries.forEach(x => {
      const opt = document.createElement('option');
      opt.value = x.c;
      opt.textContent = x.f + ' ' + x.c;
      phoneSelect.appendChild(opt);
    });

    const params = new URLSearchParams(location.search);
    const plan = params.get('plan') || 'starter';
    document.getElementById('plan-label').textContent = plan === 'team' ? 'Team plan — $49/month' : 'Starter plan — free';

    const emailInput = document.querySelector('[name=email]');
    const phoneInput = document.querySelector('[name=phone]');
    const usernameInput = document.querySelector('[name=username]');
    const passwordInput = document.querySelector('[name=password]');

    phoneInput.addEventListener('input', () => {
      phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '');
      checkPhone();
    });

    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    }

    function setState(el, valid) {
      el.classList.remove('invalid', 'valid');
      if (el.value.trim() === '') return;
      el.classList.add(valid ? 'valid' : 'invalid');
    }

    function checkUsername() {
      const ok = usernameInput.value.trim().length >= 3;
      setState(usernameInput, ok);
      return ok;
    }
    function checkEmail() {
      const ok = isValidEmail(emailInput.value.trim());
      setState(emailInput, ok);
      return ok;
    }
    function checkPassword() {
      const ok = passwordInput.value.length >= 8;
      setState(passwordInput, ok);
      return ok;
    }
    function checkPhone() {
      const v = phoneInput.value;
      if (!v) { phoneInput.classList.remove('invalid', 'valid'); return true; }
      const ok = v.length >= 6 && v.length <= 15;
      setState(phoneInput, ok);
      return ok;
    }

    usernameInput.addEventListener('input', checkUsername);
    emailInput.addEventListener('input', checkEmail);
    passwordInput.addEventListener('input', checkPassword);
    phoneInput.addEventListener('input', checkPhone);

    function validate() {
      const err = document.getElementById('error');
      err.textContent = '';
      if (!checkUsername()) { err.textContent = 'Username must be at least 3 characters'; return false; }
      if (!checkEmail()) { err.textContent = 'Enter a valid email'; return false; }
      if (!checkPassword()) { err.textContent = 'Password must be at least 8 characters'; return false; }
      if (!checkPhone()) { err.textContent = 'Phone must be 6–15 digits'; return false; }
      return true;
    }

    const searchInput = document.getElementById('address-search');
    const suggestions = document.getElementById('suggestions');
    let debounce;

    searchInput.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = searchInput.value.trim();
      if (q.length < 3) { suggestions.style.display = 'none'; return; }
      debounce = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&addressdetails=1&limit=5`, {
            headers: { 'Accept-Language': 'en' }
          });
          const data = await res.json();
          if (!data.length) { suggestions.style.display = 'none'; return; }
          suggestions.innerHTML = data.map((item, i) => `<div data-i="${i}">${item.display_name}</div>`).join('');
          suggestions.style.display = 'block';
          suggestions.querySelectorAll('div').forEach(el => {
            el.onclick = () => {
              const item = data[el.dataset.i];
              const a = item.address || {};
              document.querySelector('[name=street]').value = [a.house_number, a.road].filter(Boolean).join(' ') || item.display_name.split(',')[0];
              document.querySelector('[name=city]').value = a.city || a.town || a.village || a.municipality || '';
              document.querySelector('[name=postal]').value = a.postcode || '';
              document.querySelector('[name=country]').value = a.country || '';
              searchInput.value = item.display_name;
              suggestions.style.display = 'none';
            };
          });
        } catch { suggestions.style.display = 'none'; }
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestions.contains(e.target)) suggestions.style.display = 'none';
    });

    function showSpinner() {
      document.getElementById('spinner').style.display = 'flex';
    }

    document.getElementById('signup').onsubmit = async (e) => {
      e.preventDefault();
      if (!validate()) return;
      showSpinner();
      const form = e.target;
      const body = {
        username: form.username.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        business: form.business.value.trim(),
        street: form.street.value.trim(),
        city: form.city.value.trim(),
        postal: form.postal.value.trim(),
        country: form.country.value.trim(),
        phone: form.phone.value ? (form.phoneCode.value + form.phone.value) : '',
        plan
      };
      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('error').textContent = data.error || 'Signup failed';
          return;
        }
        setTimeout(() => {
          location.href = '/verify-pending?email=' + encodeURIComponent(body.email) + (data.verifyUrl ? '&url=' + encodeURIComponent(data.verifyUrl) : '');
        }, 400);
      } catch {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('error').textContent = 'Network error';
      }
    };
  </script>
</body>
</html>
