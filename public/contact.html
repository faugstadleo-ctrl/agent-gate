<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Agent Gate</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #111111;
      --border: #555555;
      --text: #e0e0e0;
      --muted: #888888;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem; border-bottom: 1px solid var(--border); }
    .logo { font-weight: 600; }
    nav a { color: var(--muted); text-decoration: none; }
    .content { max-width: 480px; margin: 4rem auto; padding: 0 2rem; }
    h1 { margin-bottom: 1.5rem; }
    input, textarea, button {
      width: 100%;
      padding: 0.7rem;
      margin: 0.5rem 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1rem;
    }
    button { background: var(--accent); color: #000; border: none; font-weight: 500; cursor: pointer; }
    #msg { margin-top: 1rem; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Agent Gate</div>
    <a href="/pricing">Pricing</a>
  </nav>
  <div class="content">
    <h1>Enterprise contact</h1>
    <form id="contact">
      <input type="text" id="name" placeholder="Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="text" id="company" placeholder="Company">
      <textarea id="message" placeholder="What do you need?" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
    <div id="msg"></div>
  </div>
  <script>
    document.getElementById('contact').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          company: document.getElementById('company').value,
          message: document.getElementById('message').value,
          plan: 'enterprise'
        })
      });
      const msg = document.getElementById('msg');
      if (res.ok) {
        msg.textContent = 'Received. We will reply to the email you provided.';
        e.target.reset();
      } else {
        msg.textContent = 'Failed to send. Try again.';
      }
    };
  </script>
</body>
</html>
